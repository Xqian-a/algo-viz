<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算法可视化 — 考研数据结构</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/code-panel.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/prism-theme.css">
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">📊</span>
          <h1 class="logo-text">算法可视化</h1>
          <span class="logo-subtitle">考研数据结构</span>
        </div>
      </div>
      <div class="header-right">
        <button class="btn btn-ghost" id="btn-upload" title="上传自定义代码">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>上传代码</span>
        </button>
        <button class="btn btn-ghost" id="btn-help" title="帮助">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="搜索算法..." autocomplete="off">
        </div>
        <nav class="sidebar-nav" id="sidebar-nav">
          <!-- Populated by JS -->
        </nav>
      </aside>

      <!-- Visualization Area -->
      <section class="viz-area">
        <div class="viz-header">
          <div class="viz-title" id="viz-title">选择一个算法开始学习</div>
          <div class="viz-badge" id="viz-badge"></div>
        </div>
        <div class="viz-canvas-container" id="canvas-container">
          <canvas id="viz-canvas"></canvas>
          <div class="viz-placeholder" id="viz-placeholder">
            <div class="placeholder-icon">🎯</div>
            <div class="placeholder-text">从左侧选择一个算法</div>
            <div class="placeholder-hint">或上传你自己的代码</div>
          </div>
        </div>
        <!-- Info Panel -->
        <div class="info-panel" id="info-panel">
          <div class="info-content" id="info-content"></div>
        </div>
      </section>

      <!-- Code Panel -->
      <aside class="code-panel" id="code-panel">
        <div class="code-panel-header">
          <span class="code-panel-title">C++ 代码</span>
          <div class="code-panel-actions">
            <button class="btn btn-icon" id="btn-copy-code" title="复制代码">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button class="btn btn-icon" id="btn-toggle-code" title="收起代码面板">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
          </div>
        </div>
        <div class="code-panel-body" id="code-panel-body">
          <pre class="line-numbers" id="code-display"><code class="language-cpp" id="code-content">// 选择一个算法查看 C++ 代码</code></pre>
        </div>
      </aside>
    </main>

    <!-- Control Bar -->
    <footer class="control-bar" id="control-bar">
      <div class="controls-left">
        <button class="btn btn-icon" id="btn-first" title="首步 (Home)" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/></svg>
        </button>
        <button class="btn btn-icon" id="btn-prev" title="上一步 (←)" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="btn btn-primary btn-play" id="btn-play" title="播放/暂停 (Space)" disabled>
          <svg class="icon-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg class="icon-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="btn btn-icon" id="btn-next" title="下一步 (→)" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <button class="btn btn-icon" id="btn-last" title="末步 (End)" disabled>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>
        </button>
      </div>
      <div class="controls-center">
        <div class="speed-control">
          <label>速度</label>
          <div class="speed-buttons" id="speed-buttons">
            <button class="btn btn-speed" data-speed="0.5">0.5x</button>
            <button class="btn btn-speed active" data-speed="1">1x</button>
            <button class="btn btn-speed" data-speed="2">2x</button>
            <button class="btn btn-speed" data-speed="4">4x</button>
          </div>
        </div>
        <div class="progress-control">
          <div class="progress-bar" id="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
            <input type="range" class="progress-slider" id="progress-slider" min="0" max="0" value="0">
          </div>
          <span class="progress-text" id="progress-text">0 / 0</span>
        </div>
      </div>
      <div class="controls-right">
        <div class="search-key-input" id="search-key-section" style="display:none">
          <label>查找目标</label>
          <input type="number" id="search-key-input" placeholder="输入查找值" />
          <button class="btn btn-primary btn-sm" id="btn-search-go">查找</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-data-edit" title="修改数据">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>数据</span>
        </button>
      </div>
    </footer>

    <!-- Step Description -->
    <div class="step-description" id="step-description">
      <span class="step-desc-text" id="step-desc-text"></span>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="upload-modal">
        <div class="modal-header">
          <h2>上传自定义代码</h2>
          <button class="btn btn-icon modal-close" id="modal-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="upload-section">
            <label class="upload-label">粘贴 C/C++ 代码</label>
            <textarea id="upload-code" class="upload-textarea" placeholder="// 在这里粘贴你的 C/C++ 代码&#10;void bubbleSort(int arr[], int n) {&#10;    for (int i = 0; i < n-1; i++) {&#10;        for (int j = 0; j < n-1-i; j++) {&#10;            if (arr[j] > arr[j+1]) {&#10;                swap(arr[j], arr[j+1]);&#10;            }&#10;        }&#10;    }&#10;}" spellcheck="false"></textarea>
          </div>
          <div class="upload-section">
            <label class="upload-label">测试数据（逗号分隔）</label>
            <input type="text" id="upload-data" class="upload-input" placeholder="例如: 64, 34, 25, 12, 22, 11, 90" value="64, 34, 25, 12, 22, 11, 90">
          </div>
          <div class="upload-result" id="upload-result"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="btn-cancel-upload">取消</button>
          <button class="btn btn-primary" id="btn-analyze-code">分析代码</button>
        </div>
      </div>
    </div>

    <!-- Data Edit Modal -->
    <div class="modal-overlay" id="data-modal-overlay">
      <div class="modal modal-sm" id="data-modal">
        <div class="modal-header">
          <h2>修改数据</h2>
          <button class="btn btn-icon modal-close" id="data-modal-close">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="upload-section">
            <label class="upload-label" id="data-edit-label">输入数据</label>
            <input type="text" id="data-edit-input" class="upload-input" placeholder="逗号分隔的数字">
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="btn-random-data">随机生成</button>
          <button class="btn btn-ghost" id="btn-cancel-data">取消</button>
          <button class="btn btn-primary" id="btn-apply-data">应用</button>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- Prism.js -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-c.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-cpp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>

  <!-- App Entry -->
  <script type="module" src="js/app.js"></script>
  <script>
    window.addEventListener('error', (e) => console.error('[Global Error]', e.message, e.filename, e.lineno));
    window.addEventListener('unhandledrejection', (e) => console.error('[Unhandled Rejection]', e.reason));
  </script>
</body>
</html>
