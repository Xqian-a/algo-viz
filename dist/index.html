/* === css/variables.css === */
:root {
  /* Colors - Dark Theme */
  --bg-primary: #0f1117;
  --bg-secondary: #161822;
  --bg-tertiary: #1c1f2e;
  --bg-surface: #222538;
  --bg-hover: #2a2d42;
  --bg-active: #32365a;

  /* Accent Colors */
  --accent-blue: #4e7cff;
  --accent-blue-light: #6b94ff;
  --accent-blue-glow: rgba(78, 124, 255, 0.3);
  --accent-purple: #9b7dff;
  --accent-purple-glow: rgba(155, 125, 255, 0.3);
  --accent-green: #4ade80;
  --accent-green-glow: rgba(74, 222, 128, 0.3);
  --accent-yellow: #fbbf24;
  --accent-yellow-glow: rgba(251, 191, 36, 0.3);
  --accent-red: #f87171;
  --accent-red-glow: rgba(248, 113, 113, 0.3);
  --accent-cyan: #22d3ee;
  --accent-orange: #fb923c;

  /* Text Colors */
  --text-primary: #e8eaf0;
  --text-secondary: #9ca3b8;
  --text-muted: #5d6380;
  --text-accent: var(--accent-blue-light);

  /* Border */
  --border-color: rgba(255, 255, 255, 0.06);
  --border-active: rgba(78, 124, 255, 0.4);

  /* Glass Effect */
  --glass-bg: rgba(22, 24, 34, 0.85);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

  /* Spacing */
  --sp-xs: 4px;
  --sp-sm: 8px;
  --sp-md: 12px;
  --sp-lg: 16px;
  --sp-xl: 24px;
  --sp-2xl: 32px;
  --sp-3xl: 48px;

  /* Border Radius */
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  /* Fonts */
  --font-ui: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;

  /* Sizes */
  --header-height: 56px;
  --sidebar-width: 280px;
  --code-panel-width: 380px;
  --control-height: 64px;

  /* Transitions */
  --transition-fast: 0.15s ease;
  --transition-normal: 0.25s ease;
  --transition-slow: 0.4s ease;

  /* Z-index */
  --z-sidebar: 10;
  --z-header: 20;
  --z-modal: 100;
  --z-toast: 200;
}

/* === css/reset.css === */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-ui);
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
  overflow: hidden;
  height: 100vh;
  width: 100vw;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font: inherit; color: inherit; background: none; border: none; outline: none; }
ul, ol { list-style: none; }
img { max-width: 100%; display: block; }
canvas { display: block; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

::selection { background: var(--accent-blue-glow); color: var(--text-primary); }

/* === css/layout.css === */
#app {
  display: grid;
  grid-template-rows: var(--header-height) 1fr var(--control-height);
  height: 100vh;
  width: 100vw;
  overflow: hidden;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-xl);
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  z-index: var(--z-header);
}

.header-left { display: flex; align-items: center; gap: var(--sp-lg); }
.header-right { display: flex; align-items: center; gap: var(--sp-sm); }

.logo {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}

.logo-icon {
  font-size: 1.6rem;
  line-height: 1;
}

.logo-text {
  font-size: 1.15rem;
  font-weight: 700;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo-subtitle {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-left: var(--sp-xs);
  padding-left: var(--sp-sm);
  border-left: 1px solid var(--border-color);
}

/* Main Area */
.app-main {
  display: grid;
  grid-template-columns: var(--sidebar-width) 1fr var(--code-panel-width);
  overflow: hidden;
  position: relative;
}

/* Visualization Area */
.viz-area {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
  background: var(--bg-primary);
  min-height: 0;
}

.viz-header {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-md) var(--sp-xl);
  border-bottom: 1px solid var(--border-color);
  min-height: 42px;
}

.viz-title {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-primary);
}

.viz-badge {
  font-size: 0.72rem;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  background: var(--accent-blue-glow);
  color: var(--accent-blue-light);
  font-weight: 500;
}

.viz-canvas-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 200px;
}

#viz-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
}

.viz-placeholder {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
}

.viz-placeholder.hidden { display: none; }

.placeholder-icon {
  font-size: 3rem;
  margin-bottom: var(--sp-lg);
  opacity: 0.5;
}

.placeholder-text {
  font-size: 1.1rem;
  color: var(--text-secondary);
  margin-bottom: var(--sp-sm);
}

.placeholder-hint {
  font-size: 0.85rem;
  color: var(--text-muted);
}

/* Info Panel */
.info-panel {
  border-top: 1px solid var(--border-color);
  background: var(--bg-secondary);
  max-height: 0;
  overflow: hidden;
  transition: max-height var(--transition-normal);
}

.info-panel.open {
  max-height: 160px;
  overflow-y: auto;
}

.info-resize-handle {
  background: transparent;
  transition: background var(--transition-fast);
}

.info-resize-handle:hover {
  background: var(--accent-blue);
}

.info-content {
  padding: var(--sp-lg) var(--sp-xl);
}

.info-content h3 {
  font-size: 1rem;
  font-weight: 600;
  margin-bottom: var(--sp-sm);
  color: var(--text-primary);
}

.info-content .complexity {
  display: flex;
  gap: var(--sp-xl);
  margin: var(--sp-sm) 0;
  font-size: 0.85rem;
}

.info-content .complexity-item {
  display: flex;
  gap: var(--sp-xs);
}

.info-content .complexity-label {
  color: var(--text-muted);
}

.info-content .complexity-value {
  color: var(--accent-cyan);
  font-family: var(--font-mono);
  font-size: 0.8rem;
}

.info-content .description {
  color: var(--text-secondary);
  font-size: 0.85rem;
  line-height: 1.6;
  margin: var(--sp-sm) 0;
}

.info-content .key-points {
  margin-top: var(--sp-sm);
}

.info-content .key-points h4 {
  font-size: 0.85rem;
  color: var(--accent-yellow);
  margin-bottom: var(--sp-xs);
}

.info-content .key-points ul {
  padding-left: var(--sp-lg);
}

.info-content .key-points li {
  font-size: 0.82rem;
  color: var(--text-secondary);
  margin-bottom: 2px;
  list-style: disc;
}

/* Step Description */
.step-description {
  position: fixed;
  bottom: calc(var(--control-height) + 8px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 15;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-lg);
  padding: var(--sp-sm) var(--sp-xl);
  box-shadow: var(--glass-shadow);
  max-width: 600px;
  opacity: 1;
  pointer-events: none;
  visibility: visible;
}

.step-description.hidden {
  opacity: 0;
  visibility: hidden;
}

.step-description.hidden {
  opacity: 0;
  transform: translateX(-50%) translateY(8px);
}

.step-desc-text {
  font-size: 0.85rem;
  color: var(--text-primary);
}

/* Responsive */
@media (max-width: 1200px) {
  .app-main {
    grid-template-columns: var(--sidebar-width) 1fr;
  }
  .code-panel {
    display: none;
  }
  .code-panel.show {
    display: flex;
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: var(--code-panel-width);
    z-index: 15;
  }
}

@media (max-width: 768px) {
  .app-main {
    grid-template-columns: 1fr;
  }
  .sidebar {
    display: none;
  }
  .logo-subtitle { display: none; }
}

/* === css/sidebar.css === */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border-color);
  overflow: hidden;
  z-index: var(--z-sidebar);
}

.sidebar-search {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-md) var(--sp-lg);
  border-bottom: 1px solid var(--border-color);
  color: var(--text-muted);
}

.sidebar-search input {
  flex: 1;
  font-size: 0.85rem;
  color: var(--text-primary);
}

.sidebar-search input::placeholder {
  color: var(--text-muted);
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-sm) 0;
}

/* Chapter Group */
.chapter-group {
  margin-bottom: var(--sp-xs);
}

.chapter-header {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-lg);
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
  cursor: pointer;
  transition: color var(--transition-fast);
  user-select: none;
}

.chapter-header:hover {
  color: var(--text-primary);
}

.chapter-header .chapter-arrow {
  font-size: 0.65rem;
  transition: transform var(--transition-fast);
  color: var(--text-muted);
}

.chapter-group.expanded .chapter-header .chapter-arrow {
  transform: rotate(90deg);
}

.chapter-header .chapter-icon {
  font-size: 0.95rem;
  width: 20px;
  text-align: center;
}

.chapter-header .chapter-name {
  flex: 1;
}

.chapter-header .chapter-count {
  font-size: 0.7rem;
  font-weight: 400;
  color: var(--text-muted);
  background: var(--bg-tertiary);
  padding: 1px 6px;
  border-radius: var(--radius-full);
}

.chapter-items {
  display: none;
  padding: var(--sp-xs) 0;
}

.chapter-group.expanded .chapter-items {
  display: block;
}

/* Algorithm Item */
.algo-item {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: var(--sp-sm) var(--sp-lg);
  padding-left: calc(var(--sp-lg) + 28px);
  font-size: 0.82rem;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
  position: relative;
}

.algo-item::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: transparent;
  transition: background var(--transition-fast);
  border-radius: 0 2px 2px 0;
}

.algo-item:hover {
  color: var(--text-primary);
  background: var(--bg-hover);
}

.algo-item.active {
  color: var(--accent-blue-light);
  background: var(--bg-active);
}

.algo-item.active::before {
  background: var(--accent-blue);
}

.algo-item .algo-name-zh {
  flex: 1;
  font-weight: 500;
}

.algo-item .algo-name-en {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
}

/* Upload Button in Sidebar */
.sidebar-upload {
  margin: var(--sp-md) var(--sp-lg);
  padding: var(--sp-md);
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-md);
  text-align: center;
  cursor: pointer;
  transition: all var(--transition-fast);
  font-size: 0.82rem;
  color: var(--text-muted);
}

.sidebar-upload:hover {
  border-color: var(--accent-blue);
  color: var(--accent-blue-light);
  background: var(--accent-blue-glow);
}

.sidebar-upload svg {
  display: inline-block;
  vertical-align: middle;
  margin-right: var(--sp-xs);
}

/* === css/code-panel.css === */
.code-panel {
  display: flex;
  flex-direction: column;
  background: var(--bg-secondary);
  border-left: 1px solid var(--border-color);
  overflow: hidden;
  position: relative;
  min-width: 200px;
  transition: width 0.15s ease;
}

/* Resize handle */
.code-panel .resize-handle {
  position: absolute;
  left: -3px;
  top: 0;
  bottom: 0;
  width: 6px;
  cursor: col-resize;
  z-index: 5;
  transition: background 0.15s;
}

.code-panel .resize-handle:hover,
.code-panel .resize-handle.active {
  background: var(--accent-blue);
}

/* Collapsed state */
.code-panel.collapsed {
  width: 0 !important;
  min-width: 0;
  border-left: none;
  overflow: hidden;
}

.code-panel.collapsed .code-panel-header,
.code-panel.collapsed .code-panel-body {
  display: none;
}

/* Expand tab when collapsed */
.code-panel .expand-tab {
  display: none;
  position: absolute;
  left: -32px;
  top: 50%;
  transform: translateY(-50%);
  width: 32px;
  height: 64px;
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-right: none;
  border-radius: var(--radius-md) 0 0 var(--radius-md);
  cursor: pointer;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  z-index: 5;
}

.code-panel .expand-tab:hover {
  color: var(--accent-blue-light);
  background: var(--bg-hover);
}

.code-panel.collapsed .expand-tab {
  display: flex;
}

.code-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-sm) var(--sp-lg);
  border-bottom: 1px solid var(--border-color);
  min-height: 40px;
}

.code-panel-title {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--text-secondary);
}

.code-panel-actions {
  display: flex;
  gap: var(--sp-xs);
}

.code-panel-body {
  flex: 1;
  overflow: auto;
  padding: 0;
}

.code-panel-body pre {
  margin: 0;
  padding: var(--sp-lg) 0;
  background: transparent !important;
  font-size: 0.82rem;
  line-height: 1.65;
  tab-size: 4;
}

.code-panel-body pre code {
  background: transparent !important;
  font-family: var(--font-mono) !important;
}

/* Prism line numbers override */
.code-panel-body pre[class*="language-"] {
  padding-left: 3.5em;
}

.code-panel-body .line-numbers .line-numbers-rows {
  border-right: 1px solid var(--border-color);
  padding-right: var(--sp-sm);
}

.code-panel-body .line-numbers-rows > span {
  display: block;
  position: relative;
}

.code-panel-body .line-numbers-rows > span::before {
  color: var(--text-muted);
  font-size: 0.75rem;
}

/* Active line */
.code-panel-body .line-numbers-rows > span.active-line {
  background: var(--accent-blue-glow);
  border-left: 3px solid var(--accent-blue);
  margin-left: -3px;
}

.code-panel-body .line-numbers-rows > span.active-line::before {
  color: var(--accent-blue-light);
  font-weight: 600;
}

/* === css/controls.css === */
.control-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 var(--sp-xl);
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
  gap: var(--sp-xl);
}

.controls-left {
  display: flex;
  align-items: center;
  gap: var(--sp-xs);
}

.controls-center {
  display: flex;
  align-items: center;
  gap: var(--sp-2xl);
  flex: 1;
  justify-content: center;
}

.controls-right {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}

/* Play Button */
.btn-play {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--accent-blue);
  color: #fff;
  transition: all var(--transition-fast);
}

.btn-play:hover:not(:disabled) {
  background: var(--accent-blue-light);
  box-shadow: 0 0 20px var(--accent-blue-glow);
  transform: scale(1.05);
}

.btn-play:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

/* Speed Control */
.speed-control {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
}

.speed-control label {
  font-size: 0.75rem;
  color: var(--text-muted);
}

.speed-buttons {
  display: flex;
  gap: 2px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-sm);
  padding: 2px;
}

.btn-speed {
  padding: 3px 10px;
  font-size: 0.72rem;
  font-weight: 500;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  transition: all var(--transition-fast);
}

.btn-speed:hover {
  color: var(--text-primary);
}

.btn-speed.active {
  background: var(--accent-blue);
  color: #fff;
}

/* Search Key Input */
.search-key-input {
  display: flex;
  align-items: center;
  gap: var(--sp-sm);
  padding: 4px 8px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-color);
}

.search-key-input label {
  font-size: 0.75rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.search-key-input input {
  width: 70px;
  padding: 3px 8px;
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-family: var(--font-mono);
  color: var(--text-primary);
  text-align: center;
}

.search-key-input input:focus {
  border-color: var(--accent-blue);
  outline: none;
}

/* Progress Control */
.progress-control {
  display: flex;
  align-items: center;
  gap: var(--sp-md);
  flex: 1;
  max-width: 400px;
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: var(--bg-tertiary);
  border-radius: var(--radius-full);
  position: relative;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
  border-radius: var(--radius-full);
  width: 0;
  transition: width 0.15s ease;
}

.progress-slider {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
  margin: 0;
}

.progress-text {
  font-size: 0.72rem;
  color: var(--text-muted);
  font-family: var(--font-mono);
  white-space: nowrap;
  min-width: 50px;
  text-align: center;
}

/* === css/components.css === */
/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-xs);
  padding: var(--sp-sm) var(--sp-md);
  font-size: 0.82rem;
  font-weight: 500;
  border-radius: var(--radius-md);
  transition: all var(--transition-fast);
  white-space: nowrap;
}

.btn-ghost {
  color: var(--text-secondary);
}

.btn-ghost:hover {
  color: var(--text-primary);
  background: var(--bg-hover);
}

.btn-primary {
  background: var(--accent-blue);
  color: #fff;
}

.btn-primary:hover {
  background: var(--accent-blue-light);
  box-shadow: 0 0 20px var(--accent-blue-glow);
}

.btn-icon {
  width: 32px;
  height: 32px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
}

.btn-icon:hover:not(:disabled) {
  color: var(--text-primary);
  background: var(--bg-hover);
}

.btn-icon:disabled {
  opacity: 0.25;
  cursor: not-allowed;
}

.btn-sm {
  padding: var(--sp-xs) var(--sp-sm);
  font-size: 0.75rem;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: var(--z-modal);
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
  visibility: visible;
}

.modal {
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xl);
  box-shadow: var(--glass-shadow);
  width: 90%;
  max-width: 640px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.95) translateY(10px);
  transition: transform var(--transition-normal);
}

.modal-overlay.open .modal {
  transform: scale(1) translateY(0);
}

.modal-sm {
  max-width: 420px;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-lg) var(--sp-xl);
  border-bottom: 1px solid var(--border-color);
}

.modal-header h2 {
  font-size: 1rem;
  font-weight: 600;
}

.modal-body {
  flex: 1;
  overflow-y: auto;
  padding: var(--sp-xl);
}

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-sm);
  padding: var(--sp-lg) var(--sp-xl);
  border-top: 1px solid var(--border-color);
}

/* Upload Form */
.upload-section {
  margin-bottom: var(--sp-lg);
}

.upload-label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: var(--sp-sm);
}

.upload-textarea {
  width: 100%;
  min-height: 200px;
  padding: var(--sp-md);
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-family: var(--font-mono);
  font-size: 0.82rem;
  line-height: 1.6;
  color: var(--text-primary);
  resize: vertical;
  transition: border-color var(--transition-fast);
}

.upload-textarea:focus {
  border-color: var(--accent-blue);
}

.upload-textarea::placeholder {
  color: var(--text-muted);
}

.upload-input {
  width: 100%;
  padding: var(--sp-sm) var(--sp-md);
  background: var(--bg-primary);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 0.85rem;
  color: var(--text-primary);
  transition: border-color var(--transition-fast);
}

.upload-input:focus {
  border-color: var(--accent-blue);
}

.upload-input::placeholder {
  color: var(--text-muted);
}

.upload-result {
  margin-top: var(--sp-md);
  padding: var(--sp-md);
  border-radius: var(--radius-md);
  font-size: 0.82rem;
  display: none;
}

.upload-result.show {
  display: block;
}

.upload-result.success {
  background: var(--accent-green-glow);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
}

.upload-result.warning {
  background: var(--accent-yellow-glow);
  border: 1px solid var(--accent-yellow);
  color: var(--accent-yellow);
}

.upload-result.error {
  background: var(--accent-red-glow);
  border: 1px solid var(--accent-red);
  color: var(--accent-red);
}

/* Toast */
.toast-container {
  position: fixed;
  top: calc(var(--header-height) + var(--sp-md));
  right: var(--sp-xl);
  z-index: var(--z-toast);
  display: flex;
  flex-direction: column;
  gap: var(--sp-sm);
  pointer-events: none;
}

.toast {
  padding: var(--sp-md) var(--sp-lg);
  background: var(--bg-surface);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  box-shadow: var(--glass-shadow);
  font-size: 0.82rem;
  color: var(--text-primary);
  pointer-events: auto;
  animation: toastIn 0.3s ease;
}

.toast.toast-out {
  animation: toastOut 0.3s ease forwards;
}

.toast.success { border-left: 3px solid var(--accent-green); }
.toast.error { border-left: 3px solid var(--accent-red); }
.toast.info { border-left: 3px solid var(--accent-blue); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes toastOut {
  from { opacity: 1; transform: translateX(0); }
  to { opacity: 0; transform: translateX(20px); }
}

/* === css/animations.css === */
/* Keyframes */
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 5px var(--accent-blue-glow); }
  50% { box-shadow: 0 0 20px var(--accent-blue-glow); }
}

@keyframes scaleIn {
  from { transform: scale(0.8); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Utility animation classes */
.animate-fade-in { animation: fadeIn var(--transition-normal); }
.animate-slide-up { animation: slideUp var(--transition-normal); }
.animate-pulse { animation: pulse 2s infinite; }
.animate-glow { animation: glow 2s infinite; }

/* === css/prism-theme.css === */
/* Custom Prism.js dark theme override */
.code-panel-body pre[class*="language-"],
.code-panel-body code[class*="language-"] {

.code-panel-body pre[class*="language-"] ::selection,

.code-panel-body .token.atrule,

.code-panel-body .token.function,

.code-panel-body .token.important,

/* Line numbers plugin override */
.code-panel-body pre[class*="language-"].line-numbers {
  position: relative;

}

.code-panel-body pre[class*="language-"].line-numbers > code {

}

.code-panel-body .line-numbers-rows {

  left: -3.8em;

.code-panel-body .line-numbers-rows > span {
  display: block;

}

.code-panel-body .line-numbers-rows > span::before {
  content: counter(linenumber);

}

/* Active line highlight */

.code-panel-body .line-numbers-rows > span.active-line::before {

const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

function createElement(tag, attrs = {}, children = []) {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === 'className') el.className = value;
    else if (key === 'style' && typeof value === 'object') Object.assign(el.style, value);
    else if (key === 'dataset') Object.assign(el.dataset, value);
    else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), value);
    else el.setAttribute(key, value);
  }
  for (const child of children) {
    if (typeof child === 'string') el.appendChild(document.createTextNode(child));
    else if (child) el.appendChild(child);
  }
  return el;
}

function showToast(message, type = 'info', duration = 3000) {
  const container = $('#toast-container');
  if (!container) return;
  const toast = createElement('div', { className: `toast ${type}` }, [message]);
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('toast-out');
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

// === js/utils/easing.js ===
function linear(t) { return t; }
function easeInQuad(t) { return t * t; }
function easeOutQuad(t) { return t * (2 - t); }
function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : (t - 1) * (2 * t - 2) * (2 * t - 2) + 1; }
function easeOutBack(t) { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); }
function easeOutElastic(t) {
  if (t === 0 || t === 1) return t;
  return Math.pow(2, -10 * t) * Math.sin((t - 0.075) * (2 * Math.PI) / 0.3) + 1;
}

// === js/utils/color.js ===
function rgba(r, g, b, a = 1) { return `rgba(${r},${g},${b},${a})`; }

function hexToRgba(hex, alpha = 1) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return rgba(r, g, b, alpha);
}

function lerpColor(c1, c2, t) {
  const parse = (c) => {
    const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    return m ? [+m[1], +m[2], +m[3]] : [0, 0, 0];
  };
  const [r1, g1, b1] = parse(c1);
  const [r2, g2, b2] = parse(c2);
  return rgba(
    Math.round(r1 + (r2 - r1) * t),
    Math.round(g1 + (g2 - g1) * t),
    Math.round(b1 + (b2 - b1) * t)
  );
}

// === js/core/event-bus.js ===
class EventBus {
  constructor() {
    this._listeners = new Map();
  }

  on(event, callback) {
    if (!this._listeners.has(event)) this._listeners.set(event, new Set());
    this._listeners.get(event).add(callback);
    return () => this.off(event, callback);
  }

  off(event, callback) {
    const set = this._listeners.get(event);
    if (set) set.delete(callback);
  }

  emit(event, payload) {
    const set = this._listeners.get(event);
    if (set) set.forEach(cb => cb(payload));
  }
}

const eventBus = new EventBus();

// === js/core/registry.js ===

class Registry {
  constructor() {
    this._algorithms = new Map();
    this._chapters = new Map();
    for (const ch of CHAPTERS) {
      this._chapters.set(ch.id, { ...ch, algorithms: [] });
    }
  }

  register(entry) {
    this._algorithms.set(entry.id, entry);
    const ch = this._chapters.get(entry.chapter);
    if (ch) ch.algorithms.push(entry);
  }

  get(id) { return this._algorithms.get(id); }

  getByChapter(chapterId) {
    const ch = this._chapters.get(chapterId);
    return ch ? ch.algorithms : [];
  }

  getAllChapters() {
    return [...this._chapters.values()].filter(ch => ch.algorithms.length > 0);
  }

  getAll() { return [...this._algorithms.values()]; }

  search(query) {
    const q = query.toLowerCase();
    return this.getAll().filter(a =>
      a.name.toLowerCase().includes(q) ||
      a.nameEn.toLowerCase().includes(q) ||
      a.description.toLowerCase().includes(q)
    );
  }
}

// === js/core/step-engine.js ===

class StepEngine {
  constructor() {
    this.steps = [];
    this.currentIndex = -1;
    this.isPlaying = false;
    this.speed = 1;
    this._timer = null;
    this._algorithm = null;
    this._data = null;
  }

  load(algorithm, data, extra) {
    this.pause();
    this._algorithm = algorithm;
    this._data = data;
    this._extra = extra;
    this.steps = algorithm.generateSteps(data, extra);
    this.currentIndex = this.steps.length > 0 ? 0 : -1;
    eventBus.emit('steps-loaded', { steps: this.steps, algorithm, currentIndex: this.currentIndex });
    if (this.currentIndex >= 0) {
      eventBus.emit('step-changed', { step: this.steps[this.currentIndex], index: this.currentIndex });
    }
  }

  reload() {
    if (this._algorithm && this._data) {
      this.load(this._algorithm, this._data, this._extra);
    }
  }

  play() {
    if (this.isPlaying || this.steps.length === 0) return;
    this.isPlaying = true;
    eventBus.emit('play-state-changed', { isPlaying: true });
    this._tick();
  }

  pause() {
    this.isPlaying = false;
    if (this._timer) { clearTimeout(this._timer); this._timer = null; }
    eventBus.emit('play-state-changed', { isPlaying: false });
  }

  togglePlay() {
    if (this.isPlaying) this.pause();
    else this.play();
  }

  stepForward() {
    if (this.currentIndex < this.steps.length - 1) {
      this.currentIndex++;
      eventBus.emit('step-changed', { step: this.steps[this.currentIndex], index: this.currentIndex });
    } else {
      this.pause();
      eventBus.emit('complete', {});
    }
  }

  stepBackward() {
    if (this.currentIndex > 0) {
      this.currentIndex--;
      eventBus.emit('step-changed', { step: this.steps[this.currentIndex], index: this.currentIndex });
    }
  }

  goToStep(index) {
    const clamped = Math.max(0, Math.min(index, this.steps.length - 1));
    if (clamped !== this.currentIndex) {
      this.currentIndex = clamped;
      eventBus.emit('step-changed', { step: this.steps[this.currentIndex], index: this.currentIndex });
    }
  }

  setSpeed(multiplier) {
    this.speed = multiplier;
    eventBus.emit('speed-changed', { speed: multiplier });
  }

  reset() {
    this.pause();
    this.currentIndex = this.steps.length > 0 ? 0 : -1;
    if (this.currentIndex >= 0) {
      eventBus.emit('step-changed', { step: this.steps[this.currentIndex], index: this.currentIndex });
    }
  }

  getCurrentStep() {
    return this.currentIndex >= 0 ? this.steps[this.currentIndex] : null;
  }

  getProgress() {
    return {
      current: this.currentIndex + 1,
      total: this.steps.length,
      percent: this.steps.length > 0 ? ((this.currentIndex + 1) / this.steps.length) * 100 : 0,
    };
  }

  _tick() {
    if (!this.isPlaying) return;
    const interval = SPEED_MAP[this.speed] || 800;
    this._timer = setTimeout(() => {
      this.stepForward();
      if (this.isPlaying) this._tick();
    }, interval);
  }
}

const stepEngine = new StepEngine();

// === js/core/animation.js ===

function animate(duration, onProgress, onComplete, easingFn = easeInOutCubic) {
  const start = performance.now();
  let raf;

  function tick(now) {
    const elapsed = now - start;
    const t = Math.min(elapsed / duration, 1);
    const eased = easingFn(t);
    onProgress(eased, t);
    if (t < 1) {
      raf = requestAnimationFrame(tick);
    } else {
      if (onComplete) onComplete();
    }
  }

  raf = requestAnimationFrame(tick);
  return () => cancelAnimationFrame(raf);
}

function lerp(a, b, t) { return a + (b - a) * t; }

// === js/core/canvas-manager.js ===
class CanvasManager {
  constructor() {
    this.canvas = null;
    this.ctx = null;
    this.width = 0;
    this.height = 0;
    this.dpr = window.devicePixelRatio || 1;
    this._resizeObserver = null;
    this._onResize = null;
  }

  init(canvas, onResize) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this._onResize = onResize;
    this._setupResize();
    this._resize();
  }

  _setupResize() {
    const container = this.canvas.parentElement;
    this._resizeObserver = new ResizeObserver(() => this._resize());
    this._resizeObserver.observe(container);
  }

  _resize() {
    const container = this.canvas.parentElement;
    const rect = container.getBoundingClientRect();
    this.width = rect.width;
    this.height = rect.height;
    this.canvas.width = this.width * this.dpr;
    this.canvas.height = this.height * this.dpr;
    this.canvas.style.width = this.width + 'px';
    this.canvas.style.height = this.height + 'px';
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    if (this._onResize) this._onResize(this.width, this.height);
  }

  clear() {
    this.ctx.clearRect(0, 0, this.width, this.height);
  }

  getContext() { return this.ctx; }
  getSize() { return { width: this.width, height: this.height }; }
}

const canvasManager = new CanvasManager();

// === js/renderers/base-renderer.js ===

class BaseRenderer {
  constructor(canvasManager) {
    this.cm = canvasManager;
  }

  get ctx() { return this.cm.getContext(); }
  get w() { return this.cm.width; }
  get h() { return this.cm.height; }

  clear() { this.cm.clear(); }

  render(step) {
    this.clear();
  }

  // Drawing primitives
  drawRect(x, y, w, h, style = {}) {
    const ctx = this.ctx;
    const { fill = COLORS.default.fill, stroke = COLORS.default.stroke, lineWidth = 2, radius = 6 } = style;
    ctx.beginPath();
    if (radius > 0) {
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
      ctx.lineTo(x + w, y + h - radius);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      ctx.lineTo(x + radius, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
    } else {
      ctx.rect(x, y, w, h);
    }
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
  }

  drawCircle(x, y, r, style = {}) {
    const ctx = this.ctx;
    const { fill = COLORS.default.fill, stroke = COLORS.default.stroke, lineWidth = 2 } = style;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
  }

  drawText(text, x, y, style = {}) {
    const ctx = this.ctx;
    const { color = '#e8eaf0', font = '600 14px Inter, sans-serif', align = 'center', baseline = 'middle' } = style;
    ctx.fillStyle = color;
    ctx.font = font;
    ctx.textAlign = align;
    ctx.textBaseline = baseline;
    ctx.fillText(text, x, y);
  }

  drawArrow(x1, y1, x2, y2, style = {}) {
    const ctx = this.ctx;
    const { color = 'rgba(78,124,255,0.6)', lineWidth = 2, headSize = 8 } = style;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
    // Arrowhead
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headSize * Math.cos(angle - 0.4), y2 - headSize * Math.sin(angle - 0.4));
    ctx.lineTo(x2 - headSize * Math.cos(angle + 0.4), y2 - headSize * Math.sin(angle + 0.4));
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
  }

  drawLine(x1, y1, x2, y2, style = {}) {
    const ctx = this.ctx;
    const { color = 'rgba(78,124,255,0.4)', lineWidth = 2, dash = [] } = style;
    ctx.beginPath();
    ctx.setLineDash(dash);
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
    ctx.setLineDash([]);
  }

  drawPointer(label, x, y, style = {}) {
    const ctx = this.ctx;
    const { color = COLORS.pointer.fill } = style;
    const w = Math.max(24, ctx.measureText(label).width + 12);
    const h = 22;
    const cx = x - w / 2;
    // Triangle tip
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 5, y - h);
    ctx.lineTo(x + 5, y - h);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    // Box
    this.drawRect(cx, y - h - 16, w, 16, { fill: color, stroke: null, radius: 4 });
    this.drawText(label, x, y - h - 8, { color: '#fff', font: '600 11px JetBrains Mono, monospace' });
  }

  getColorForState(state) {
    return COLORS[state] || COLORS.default;
  }
}

// === js/renderers/array-renderer.js ===

class ArrayRenderer extends BaseRenderer {
  constructor(canvasManager) {
    super(canvasManager);
    this._mode = 'bar'; // 'cell' or 'bar'
  }

  setMode(mode) { this._mode = mode; }

  render(step) {
    super.render(step);
    if (!step || !step.data || !step.data.array) return;
    const arr = step.data.array;
    const highlights = step.highlights || {};
    const pointers = step.pointers || {};

    if (this._mode === 'bar') {
      this._renderBars(arr, highlights, pointers);
    } else {
      this._renderCells(arr, highlights, pointers);
    }
  }

  _renderBars(arr, highlights, pointers) {
    const n = arr.length;
    const maxVal = Math.max(...arr, 1);
    const padding = 60;
    const bottomPadding = 80;
    const topPadding = 50;
    const availableW = this.w - padding * 2;
    const availableH = this.h - bottomPadding - topPadding;
    const gap = Math.max(2, Math.min(6, availableW / n * 0.15));
    const barW = (availableW - gap * (n - 1)) / n;
    const baseY = this.h - bottomPadding;

    for (let i = 0; i < n; i++) {
      const x = padding + i * (barW + gap);
      const barH = (arr[i] / maxVal) * availableH * 0.85;
      const y = baseY - barH;
      const style = this._getBarStyle(i, highlights);
      // Glow effect for active states
      if (highlights.comparing?.includes(i) || highlights.swapping?.includes(i) || highlights.active?.includes(i)) {
        this.ctx.shadowColor = style.stroke;
        this.ctx.shadowBlur = 12;
      }
      this.drawRect(x, y, barW, barH, { ...style, radius: 4 });
      this.ctx.shadowBlur = 0;
      // Value label
      this.drawText(arr[i], x + barW / 2, y - 12, {
        color: style.text || '#e8eaf0',
        font: '600 12px JetBrains Mono, monospace',
      });
      // Index label
      this.drawText(i, x + barW / 2, baseY + 16, {
        color: '#5d6380',
        font: '400 11px JetBrains Mono, monospace',
      });
    }

    // Draw pointers
    this._drawPointers(pointers, padding, barW, gap, baseY);
  }

  _renderCells(arr, highlights, pointers) {
    const n = arr.length;
    const padding = 60;
    const cellSize = Math.min(56, (this.w - padding * 2) / n - 4);
    const totalW = n * (cellSize + 4) - 4;
    const startX = (this.w - totalW) / 2;
    const y = this.h / 2 - 20;

    for (let i = 0; i < n; i++) {
      const x = startX + i * (cellSize + 4);
      const style = this._getBarStyle(i, highlights);
      if (highlights.comparing?.includes(i) || highlights.swapping?.includes(i)) {
        this.ctx.shadowColor = style.stroke;
        this.ctx.shadowBlur = 10;
      }
      this.drawRect(x, y, cellSize, cellSize, { ...style, radius: 6 });
      this.ctx.shadowBlur = 0;
      this.drawText(arr[i], x + cellSize / 2, y + cellSize / 2, {
        color: style.text || '#e8eaf0',
        font: '600 14px JetBrains Mono, monospace',
      });
      this.drawText(i, x + cellSize / 2, y + cellSize + 16, {
        color: '#5d6380',
        font: '400 11px JetBrains Mono, monospace',
      });
    }
    this._drawPointers(pointers, startX, cellSize, 4, y + cellSize + 24);
  }

  _getBarStyle(index, highlights) {
    if (highlights.sorted?.includes(index)) return COLORS.sorted;
    if (highlights.swapping?.includes(index)) return COLORS.swapping;
    if (highlights.comparing?.includes(index)) return COLORS.comparing;
    if (highlights.found?.includes(index)) return COLORS.found;
    if (highlights.active?.includes(index)) return COLORS.active;
    if (highlights.current === index) return COLORS.current;
    return COLORS.default;
  }

  _drawPointers(pointers, startX, itemSize, gap, baseY) {
    if (!pointers || typeof pointers !== 'object') return;
    for (const [name, ptr] of Object.entries(pointers)) {
      if (ptr == null || typeof ptr.position !== 'number') continue;
      const x = startX + ptr.position * (itemSize + gap) + itemSize / 2;
      this.drawPointer(ptr.label || name, x, baseY + 40);
    }
  }
}

// === js/renderers/linked-list-renderer.js ===

class LinkedListRenderer extends BaseRenderer {
  render(step) {
    super.render(step);
    if (!step?.data?.nodes) return;
    const { nodes } = step.data;
    const highlights = step.highlights || {};
    const pointers = step.pointers || {};
    const n = nodes.length;
    if (n === 0) return;

    const nodeW = 90, nodeH = 44, gap = 50;
    const totalW = n * (nodeW + gap) - gap;
    const startX = Math.max(20, (this.w - totalW) / 2);
    const y = this.h / 2 - 10;

    for (let i = 0; i < n; i++) {
      const x = startX + i * (nodeW + gap);
      const node = nodes[i];
      const style = this._getNodeStyle(i, highlights);
      if (highlights.comparing?.includes(i) || highlights.active?.includes(i)) {
        this.ctx.shadowColor = style.stroke; this.ctx.shadowBlur = 12;
      }
      // Node box
      this.drawRect(x, y, nodeW * 0.6, nodeH, { ...style, radius: 8 });
      this.ctx.shadowBlur = 0;
      // Pointer section
      this.drawRect(x + nodeW * 0.6, y, nodeW * 0.4, nodeH, { fill: 'rgba(78,124,255,0.2)', stroke: style.stroke, radius: 8 });
      // Value
      this.drawText(node.value, x + nodeW * 0.3, y + nodeH / 2, { color: style.text, font: '600 14px JetBrains Mono, monospace' });
      // Arrow to next
      if (i < n - 1) {
        this.drawArrow(x + nodeW, y + nodeH / 2, x + nodeW + gap - 4, y + nodeH / 2, { color: 'rgba(78,124,255,0.5)', lineWidth: 2 });
      } else {
        // Null indicator
        this.drawText('∅', x + nodeW + 20, y + nodeH / 2, { color: '#5d6380', font: '400 14px JetBrains Mono, monospace' });
      }
    }

    // Draw pointers
    for (const [name, ptr] of Object.entries(pointers)) {
      if (ptr?.position != null && ptr.position < n) {
        const x = startX + ptr.position * (nodeW + gap) + nodeW / 2;
        this.drawPointer(ptr.label || name, x, y + nodeH + 30);
      }
    }

    // Head/Tail labels
    if (n > 0) {
      this.drawText('HEAD', startX + nodeW / 2, y - 30, { color: '#5d6380', font: '500 11px Inter, sans-serif' });
      this.drawArrow(startX + nodeW / 2, y - 22, startX + nodeW / 2, y - 4, { color: '#5d6380' });
    }
  }

  _getNodeStyle(index, highlights) {
    if (highlights.swapping?.includes(index)) return COLORS.swapping;
    if (highlights.found?.includes(index)) return COLORS.found;
    if (highlights.active?.includes(index)) return COLORS.active;
    if (highlights.comparing?.includes(index)) return COLORS.comparing;
    if (highlights.visited?.includes(index)) return COLORS.visited;
    if (highlights.sorted?.includes(index)) return COLORS.sorted;
    if (highlights.current === index) return COLORS.current;
    return COLORS.default;
  }
}

// === js/renderers/stack-renderer.js ===

class StackRenderer extends BaseRenderer {
  render(step) {
    super.render(step);
    if (!step?.data?.stack) return;
    const stack = step.data.stack;
    const highlights = step.highlights || {};
    const n = stack.length;
    if (n === 0) {
      this.drawText('空栈', this.w / 2, this.h / 2, { color: '#5d6380', font: '400 14px Inter, sans-serif' });
      return;
    }

    const cellW = Math.min(80, this.w * 0.4);
    const cellH = 44;
    const maxVisible = Math.floor((this.h - 120) / (cellH + 6));
    const startY = this.h - 80;
    const cx = this.w / 2;

    // Stack container
    const visibleCount = Math.min(n, maxVisible);
    const containerH = visibleCount * (cellH + 6) + 16;
    this.drawRect(cx - cellW / 2 - 8, startY - containerH, cellW + 16, containerH, { fill: 'rgba(78,124,255,0.05)', stroke: 'rgba(78,124,255,0.2)', lineWidth: 1, radius: 6 });

    for (let i = 0; i < visibleCount; i++) {
      const stackIdx = n - 1 - i;
      const y = startY - (i + 1) * (cellH + 6);
      const style = this._getStyle(stackIdx, highlights);
      if (i === 0) { this.ctx.shadowColor = style.stroke; this.ctx.shadowBlur = 10; }
      this.drawRect(cx - cellW / 2, y, cellW, cellH, { ...style, radius: 6 });
      this.ctx.shadowBlur = 0;
      this.drawText(stack[stackIdx], cx, y + cellH / 2, { color: style.text, font: '600 14px JetBrains Mono, monospace' });
    }

    // Top pointer
    if (n > 0) {
      const topY = startY - cellH - 6;
      this.drawText('← top', cx + cellW / 2 + 30, topY + cellH / 2, { color: '#fbbf24', font: '500 12px JetBrains Mono, monospace', align: 'left' });
    }

    // Bottom label
    this.drawText('栈底', cx, startY + 16, { color: '#5d6380', font: '400 11px Inter, sans-serif' });
  }

  _getStyle(i, highlights) {
    if (highlights.active?.includes(i)) return COLORS.active;

// === js/renderers/tree-renderer.js ===

class TreeRenderer extends BaseRenderer {
  render(step) {
    super.render(step);
    if (!step?.data?.tree) return;
    const tree = step.data.tree;
    const highlights = step.highlights || {};
    const nodes = tree.nodes || [];
    if (nodes.length === 0) return;

    // Calculate positions using level-order layout
    const positions = this._layoutTree(tree);
    const nodeR = Math.min(24, Math.max(16, this.w / (nodes.length * 3)));
    const edgeColor = 'rgba(78,124,255,0.3)';

    // Draw edges first
    for (const node of nodes) {
      const pos = positions[node.id];
      if (!pos) continue;
      if (node.left && positions[node.left]) {
        const childPos = positions[node.left];
        this.drawLine(pos.x, pos.y + nodeR, childPos.x, childPos.y - nodeR, { color: edgeColor, lineWidth: 2 });
      }
      if (node.right && positions[node.right]) {
        const childPos = positions[node.right];
        this.drawLine(pos.x, pos.y + nodeR, childPos.x, childPos.y - nodeR, { color: edgeColor, lineWidth: 2 });
      }
    }

    // Draw nodes
    for (const node of nodes) {
      const pos = positions[node.id];
      if (!pos) continue;
      const style = this._getNodeStyle(node.id, highlights);
      if (highlights.current === node.id || highlights.active?.includes(node.id)) {
        this.ctx.shadowColor = style.stroke; this.ctx.shadowBlur = 15;
      }
      this.drawCircle(pos.x, pos.y, nodeR, { ...style, lineWidth: 2.5 });
      this.ctx.shadowBlur = 0;
      this.drawText(String(node.value), pos.x, pos.y, { color: style.text, font: '600 13px JetBrains Mono, monospace' });
      // Balance factor for AVL
      if (node.bf !== undefined) {
        this.drawText(`bf=${node.bf}`, pos.x + nodeR + 14, pos.y - nodeR, { color: '#5d6380', font: '400 10px JetBrains Mono, monospace', align: 'left' });
      }
    }

    // Draw edge labels (Huffman)
    if (tree.edgeLabels) {
      for (const [parentId, childId, label] of tree.edgeLabels) {
        const pp = positions[parentId], cp = positions[childId];
        if (pp && cp) {
          this.drawText(label, (pp.x + cp.x) / 2 - 10, (pp.y + cp.y) / 2, { color: '#fbbf24', font: '600 12px JetBrains Mono, monospace' });
        }
      }
    }

    // Traversal info
    if (step.data.traversal) {
      const tx = 20, ty = 30;
      this.drawText(step.data.traversal, tx, ty, { color: '#9ca3b8', font: '400 12px JetBrains Mono, monospace', align: 'left' });
    }
  }

  _layoutTree(tree) {
    const positions = {};
    const nodes = tree.nodes || [];
    const nodeMap = {};
    for (const n of nodes) nodeMap[n.id] = n;

    const levelWidth = {};
    const levelCount = {};

    function getLevel(id, level = 0) {
      if (!id || !nodeMap[id]) return;
      levelWidth[level] = (levelWidth[level] || 0) + 1;
      levelCount[level] = (levelCount[level] || 0);
      getLevel(nodeMap[id]?.left, level + 1);
      getLevel(nodeMap[id]?.right, level + 1);
    }

    const root = tree.root;
    if (!root) return positions;

    // BFS layout
    const queue = [{ id: root, level: 0, order: 0 }];
    const levelItems = {};
    while (queue.length > 0) {
      const { id, level, order } = queue.shift();
      if (!id || !nodeMap[id]) continue;
      if (!levelItems[level]) levelItems[level] = [];
      levelItems[level].push({ id, order });
      const node = nodeMap[id];
      queue.push({ id: node.left, level: level + 1, order: order * 2 });
      queue.push({ id: node.right, level: level + 1, order: order * 2 + 1 });
    }

    const maxLevel = Math.max(0, ...Object.keys(levelItems).map(Number));
    const levelH = Math.min(70, (this.h - 80) / (maxLevel + 1));
    const topY = 50;

    for (const [level, items] of Object.entries(levelItems)) {
      const lv = Number(level);
      const y = topY + lv * levelH;
      const count = items.length;
      const spacing = this.w / (count + 1);
      items.forEach((item, idx) => {
        positions[item.id] = { x: spacing * (idx + 1), y };
      });
    }

    return positions;
  }

  _getNodeStyle(id, highlights) {
    if (highlights.swapping?.includes(id)) return COLORS.swapping;
    if (highlights.found?.includes(id)) return COLORS.found;
    if (highlights.active?.includes(id)) return COLORS.active;
    if (highlights.current === id) return COLORS.current;
    if (highlights.visited?.includes(id)) return COLORS.visited;
    if (highlights.sorted?.includes(id)) return COLORS.sorted;
    return COLORS.default;
  }
}

class GraphRenderer extends BaseRenderer {
  render(step) {
    super.render(step);
    if (!step?.data?.graph) return;
    const graph = step.data.graph;
    const highlights = step.highlights || {};
    const nodes = graph.nodes || [];
    const edges = graph.edges || [];
    if (nodes.length === 0) return;

    const nodeR = Math.min(26, Math.max(18, Math.min(this.w, this.h) / (nodes.length * 2.5)));

    // Calculate positions (circular layout for small graphs)
    const positions = {};
    const cx = this.w / 2, cy = this.h / 2;
    const radius = Math.min(cx, cy) * 0.65;

    if (graph.positions) {
      for (const n of nodes) {
        if (graph.positions[n.id]) positions[n.id] = graph.positions[n.id];
      }
    } else {
      const angleStep = (2 * Math.PI) / nodes.length;
      nodes.forEach((n, i) => {
        positions[n.id] = {
          x: cx + radius * Math.cos(angleStep * i - Math.PI / 2),
          y: cy + radius * Math.sin(angleStep * i - Math.PI / 2)
        };
      });
    }

    // Draw edges
    for (const edge of edges) {
      const from = positions[edge.from], to = positions[edge.to];
      if (!from || !to) continue;
      const isHighlighted = highlights.edges?.some(e => (e[0] === edge.from && e[1] === edge.to) || (e[0] === edge.to && e[1] === edge.from));
      const edgeColor = isHighlighted ? 'rgba(248,113,113,0.8)' : 'rgba(78,124,255,0.3)';
      const lineW = isHighlighted ? 3 : 1.5;

      // Direction for directed graph
      const dx = to.x - from.x, dy = to.y - from.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const ux = dx / dist, uy = dy / dist;
      const startX = from.x + ux * nodeR, startY = from.y + uy * nodeR;
      const endX = to.x - ux * nodeR, endY = to.y - uy * nodeR;

      if (graph.directed) {
        this.drawArrow(startX, startY, endX, endY, { color: edgeColor, lineWidth: lineW });
      } else {
        this.drawLine(startX, startY, endX, endY, { color: edgeColor, lineWidth: lineW });
      }

      // Edge weight
      if (edge.weight !== undefined) {
        const mx = (from.x + to.x) / 2, my = (from.y + to.y) / 2;
        const offsetX = -uy * 12, offsetY = ux * 12;
        this.drawRect(mx + offsetX - 12, my + offsetY - 9, 24, 18, { fill: 'rgba(15,17,23,0.9)', stroke: 'rgba(78,124,255,0.3)', radius: 4 });
        this.drawText(String(edge.weight), mx + offsetX, my + offsetY, { color: '#fbbf24', font: '600 11px JetBrains Mono, monospace' });
      }
    }

    // Draw nodes
    for (const node of nodes) {
      const pos = positions[node.id];
      if (!pos) continue;
      const style = this._getNodeStyle(node.id, highlights);
      if (highlights.current === node.id || highlights.active?.includes(node.id)) {
        this.ctx.shadowColor = style.stroke; this.ctx.shadowBlur = 15;
      }
      this.drawCircle(pos.x, pos.y, nodeR, { ...style, lineWidth: 2.5 });
      this.ctx.shadowBlur = 0;
      this.drawText(node.label || String(node.id), pos.x, pos.y, { color: style.text, font: '600 13px JetBrains Mono, monospace' });
    }

    // Adjacency matrix (if available and space permits)
    if (graph.adjMatrix && this.w > 500 && this.h > 300) {
      this._drawAdjMatrix(graph.adjMatrix, nodes);
    }
  }

  _drawAdjMatrix(matrix, nodes) {
    const cellSize = Math.min(18, 100 / nodes.length);
    const startX = 12, startY = this.h - (nodes.length + 1) * cellSize - 10;
    this.drawText('邻接矩阵:', startX, startY - 6, { color: '#5d6380', font: '400 10px Inter, sans-serif', align: 'left' });
    for (let i = 0; i < nodes.length; i++) {
      for (let j = 0; j < nodes.length; j++) {
        const val = matrix[i]?.[j] ?? 0;
        const x = startX + (j + 1) * cellSize;
        const y = startY + i * cellSize;
        this.drawText(String(val), x + cellSize / 2, y + cellSize / 2, { color: val ? '#4e7cff' : '#3d4060', font: '400 10px JetBrains Mono, monospace' });
      }
    }
  }

  _getNodeStyle(id, highlights) {
    if (highlights.found?.includes(id)) return COLORS.found;
    if (highlights.active?.includes(id)) return COLORS.active;
    if (highlights.current === id) return COLORS.current;
    if (highlights.visited?.includes(id)) return COLORS.visited;
    if (highlights.sorted?.includes(id)) return COLORS.sorted;
    return COLORS.default;
  }
}

      }

      for (let j = 0; j < pattern.length; j++) {
        const x = startX + (offset + j) * cellW;
        this.drawText(j, x + (cellW - 2) / 2, patternY + cellH + 14, { color: '#5d6380', font: '400 10px JetBrains Mono, monospace' });
      }
    }

    if (pointers.i?.position != null) {
      const x = startX + pointers.i.position * cellW + (cellW - 2) / 2;
      this.drawPointer('i', x, textY + cellH + 10);
    }
    if (pointers.j?.position != null) {
      const x = startX + (offset + pointers.j.position) * cellW + (cellW - 2) / 2;
      this.drawPointer('j', x, patternY + cellH + 30);
    }

    // next[] array
    if (nextArr) {
      const nextY = patternY + cellH + 70;
      this.drawText('next[]:', startX - 55, nextY + 14, { color: '#9b7dff', font: '500 12px JetBrains Mono, monospace', align: 'right' });
      for (let i = 0; i < nextArr.length; i++) {

        this.drawRect(x, nextY, cellW - 2, 28, { fill: 'rgba(155,125,255,0.15)', stroke: 'rgba(155,125,255,0.4)', radius: 3 });
        this.drawText(String(nextArr[i]), x + (cellW - 2) / 2, nextY + 14, { color: '#9b7dff', font: '500 12px JetBrains Mono, monospace' });
      }
    }
  }

  _getTextStyle(i, highlights) {
    if (highlights.matched?.includes(i)) return COLORS.sorted;
    if (highlights.mismatch?.includes(i)) return COLORS.swapping;
    if (highlights.comparing?.includes(i)) return COLORS.comparing;
    if (highlights.active?.includes(i)) return COLORS.active;

  _getPatternStyle(j, highlights) {
    if (highlights.patternMatched?.includes(j)) return COLORS.sorted;
    if (highlights.patternMismatch?.includes(j)) return COLORS.swapping;
    if (highlights.comparing?.includes(j + (highlights.offset || 0))) return COLORS.comparing;

  }
}

      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = startX + col * (cellW + 4);
      const y = startY + row * (cellH + 4);
      const entry = table[i];
      const style = this._getStyle(i, highlights);

      }
    }

    if (meta.chains) {
      for (const [slotIdx, chain] of Object.entries(meta.chains)) {
        const col = Number(slotIdx) % cols;
        const row = Math.floor(Number(slotIdx) / cols);
        const x = startX + col * (cellW + 4) + cellW;
        const y = startY + row * (cellH + 4) + cellH / 2;
        for (let ci = 0; ci < chain.length; ci++) {

          this.drawArrow(x + ci * 50, y, cx, y, { color: 'rgba(251,191,36,0.5)' });

          this.drawText(String(chain[ci]), cx + 20, y, { color: '#fbbf24', font: '500 12px JetBrains Mono, monospace' });
        }
      }
    }
  }

  _getStyle(i, highlights) {
    if (highlights.active?.includes(i)) return COLORS.active;
    if (highlights.comparing?.includes(i)) return COLORS.comparing;
    if (highlights.found?.includes(i)) return COLORS.found;
    if (highlights.current === i) return COLORS.current;

function initCodePanel() {
  const copyBtn = $('#btn-copy-code');
  const toggleBtn = $('#btn-toggle-code');
  const panel = $('#code-panel');

  if (!panel) return;

  // Create resize handle
  const handle = createElement('div', { className: 'resize-handle' });
  panel.insertBefore(handle, panel.firstChild);

  // Create expand tab (shown when collapsed)
  const expandTab = createElement('div', { className: 'expand-tab' });
  expandTab.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>';
  expandTab.addEventListener('click', () => expandPanel());
  panel.appendChild(expandTab);

  // Toggle (collapse)
  toggleBtn?.addEventListener('click', () => collapsePanel());

  // Copy code
  copyBtn?.addEventListener('click', () => {
    const code = $('#code-content')?.textContent;
    if (code) {
      navigator.clipboard.writeText(code).then(() => {
        const orig = copyBtn.innerHTML;
        copyBtn.innerHTML = '✓';
        setTimeout(() => copyBtn.innerHTML = orig, 1500);
      });
    }
  });

  // Resize via drag
  let isResizing = false;
  let startX = 0;
  let startWidth = 0;

  handle.addEventListener('mousedown', (e) => {
    isResizing = true;
    startX = e.clientX;
    startWidth = panel.offsetWidth;
    handle.classList.add('active');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const diff = startX - e.clientX; // dragging left increases width
    const newWidth = Math.max(200, Math.min(700, startWidth + diff));
    panel.style.width = newWidth + 'px';
    document.documentElement.style.setProperty('--code-panel-width', newWidth + 'px');
  });

  document.addEventListener('mouseup', () => {
    if (!isResizing) return;
    isResizing = false;
    handle.classList.remove('active');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  let lastWidth = '380px';

  function collapsePanel() {
    lastWidth = panel.style.width || '380px';
    panel.classList.add('collapsed');
  }

  function expandPanel() {
    panel.classList.remove('collapsed');
    panel.style.width = lastWidth;
    document.documentElement.style.setProperty('--code-panel-width', lastWidth);
  }
}

function updateCodeDisplay(sourceCode, activeLine = -1) {
  const codeEl = $('#code-content');
  const displayEl = $('#code-display');
  if (!codeEl || !displayEl) return;

  codeEl.textContent = sourceCode;
  codeEl.className = 'language-cpp';

  // Defer Prism highlighting to next frame
  requestAnimationFrame(() => {
    if (window.Prism) window.Prism.highlightElement(codeEl);
    requestAnimationFrame(() => highlightLine(activeLine));
  });
}

function highlightLine(lineNumber) {
  const displayEl = $('#code-display');
  if (!displayEl) return;

  // Remove existing highlights
  displayEl.querySelectorAll('.active-line').forEach(el => el.classList.remove('active-line'));

  if (lineNumber < 0) return;

  // Try Prism line-numbers spans first
  const lineSpans = displayEl.querySelectorAll('.line-numbers-rows > span');
  if (lineSpans.length > 0 && lineNumber > 0 && lineNumber <= lineSpans.length) {
    const span = lineSpans[lineNumber - 1];
    span.classList.add('active-line');
    span.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

    if (btnFirst) btnFirst.disabled = !hasSteps || idx <= 0;
    if (btnPrev) btnPrev.disabled = !hasSteps || idx <= 0;
    if (btnNext) btnNext.disabled = !hasSteps || idx >= total - 1;
    if (btnLast) btnLast.disabled = !hasSteps || idx >= total - 1;
  }

  function updateProgress() {
    const { current, total, percent } = stepEngine.getProgress();
    const fill = $('#progress-fill');
    const text = $('#progress-text');
    const slider = $('#progress-slider');
    if (fill) fill.style.width = `${percent}%`;
    if (text) text.textContent = `${current} / ${total}`;
    if (slider) { slider.max = total - 1; slider.value = current - 1; }
  }

  function updatePlayBtn() {
    const iconPlay = btnPlay?.querySelector('.icon-play');
    const iconPause = btnPlay?.querySelector('.icon-pause');
    if (iconPlay) iconPlay.style.display = stepEngine.isPlaying ? 'none' : '';
    if (iconPause) iconPause.style.display = stepEngine.isPlaying ? '' : 'none';
  }

  btnPlay?.addEventListener('click', () => stepEngine.togglePlay());
  btnFirst?.addEventListener('click', () => stepEngine.reset());
  btnPrev?.addEventListener('click', () => { stepEngine.pause(); stepEngine.stepBackward(); });
  btnNext?.addEventListener('click', () => { stepEngine.pause(); stepEngine.stepForward(); });
  btnLast?.addEventListener('click', () => { stepEngine.pause(); stepEngine.goToStep(stepEngine.steps.length - 1); });

  progressSlider?.addEventListener('input', (e) => {
    stepEngine.pause();
    stepEngine.goToStep(parseInt(e.target.value));
  });

  speedBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      speedBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      stepEngine.setSpeed(parseFloat(btn.dataset.speed));
    });
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    switch (e.key) {
      case ' ': e.preventDefault(); stepEngine.togglePlay(); break;
      case 'ArrowLeft': e.preventDefault(); stepEngine.pause(); stepEngine.stepBackward(); break;
      case 'ArrowRight': e.preventDefault(); stepEngine.pause(); stepEngine.stepForward(); break;
      case 'Home': e.preventDefault(); stepEngine.reset(); break;
      case 'End': e.preventDefault(); stepEngine.pause(); stepEngine.goToStep(stepEngine.steps.length - 1); break;
    }
  });

  // Listen for events
  eventBus.on('steps-loaded', () => { updateButtons(); updateProgress(); });
  eventBus.on('step-changed', () => { updateButtons(); updateProgress(); });
  eventBus.on('play-state-changed', () => { updatePlayBtn(); updateButtons(); });
  eventBus.on('complete', () => { updateButtons(); updatePlayBtn(); });

  // Initial state
  updateButtons();
  updateProgress();
  updatePlayBtn();
}

function initInfoPanel() {
  const panel = $('#info-panel');
  const content = $('#info-content');
  const dataBtn = $('#btn-data-edit');

  if (!panel) return;

  // Create resize handle at top of info panel
  const handle = createElement('div', {
    className: 'info-resize-handle',
    style: 'position:absolute;top:-4px;left:0;right:0;height:8px;cursor:ns-resize;z-index:5;'
  });
  panel.style.position = 'relative';
  panel.insertBefore(handle, panel.firstChild);

  // Resize logic
  let isResizing = false;
  let startY = 0;
  let startH = 0;

  handle.addEventListener('mousedown', (e) => {
    isResizing = true;
    startY = e.clientY;
    startH = panel.offsetHeight;
    document.body.style.cursor = 'ns-resize';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });

  document.addEventListener('mousemove', (e) => {
    if (!isResizing) return;
    const diff = startY - e.clientY; // drag up = expand
    const newH = Math.max(80, Math.min(400, startH + diff));
    panel.style.maxHeight = newH + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!isResizing) return;
    isResizing = false;
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
  });

  // Also allow double-click on handle to toggle expand/collapse
  handle.addEventListener('dblclick', () => {
    if (panel.style.maxHeight === '400px') {
      panel.style.maxHeight = '160px';
    } else {
      panel.style.maxHeight = '400px';
    }
  });

  function showAlgoInfo(id) {
    const algo = registry.get(id);
    if (!algo || !content) return;

    const timeEntries = Object.entries(algo.complexity.time).map(([k, v]) => {
      const label = k === 'best' ? '最好' : k === 'average' ? '平均' : '最坏';
      return `<span class="complexity-item"><span class="complexity-label">${label}:</span><span class="complexity-value">${v}</span></span>`;
    }).join('');

    content.innerHTML = `
      <h3>${algo.name} <span style="color:var(--text-muted);font-weight:400;font-size:0.85rem">${algo.nameEn}</span></h3>
      <div class="complexity">
        ${timeEntries}
        <span class="complexity-item"><span class="complexity-label">空间:</span><span class="complexity-value">${algo.complexity.space}</span></span>
        ${algo.complexity.stable ? `<span class="complexity-item"><span class="complexity-label">稳定性:</span><span class="complexity-value">${algo.complexity.stable}</span></span>` : ''}
      </div>
      <p class="description">${algo.description}</p>
      ${algo.keyPoints?.length ? `
        <div class="key-points">
          <h4>考研要点</h4>
          <ul>${algo.keyPoints.map(p => `<li>${p}</li>`).join('')}</ul>
        </div>
      ` : ''}
    `;

    panel.classList.add('open');
    panel.style.maxHeight = '160px';
  }

  eventBus.on('algorithm-selected', ({ id }) => showAlgoInfo(id));

  // Data edit button
  dataBtn?.addEventListener('click', () => {
    eventBus.emit('show-data-modal', {});
  });
}

const PATTERNS = [
  { regex: /for.*for.*swap|arr\[j\]\s*>\s*arr\[j\s*\+\s*1\]/i, id: 'ch7-bubble-sort', name: '冒泡排序' },
  { regex: /minIdx|min.*=.*i|arr\[j\]\s*<\s*arr\[min/i, id: 'ch7-selection-sort', name: '选择排序' },
  { regex: /key\s*=\s*arr\[i\]|while.*j\s*>=\s*0.*arr\[j\]\s*>\s*key/i, id: 'ch7-insertion-sort', name: '直接插入排序' },
  { regex: /gap\s*=\s*n\s*\/\s*2|shell/i, id: 'ch7-shell-sort', name: '希尔排序' },
  { regex: /merge|void\s+merge/i, id: 'ch7-merge-sort', name: '归并排序' },
  { regex: /partition|pivot|quick/i, id: 'ch7-quick-sort', name: '快速排序' },
  { regex: /heapify|heap|2\s*\*\s*i/i, id: 'ch7-heap-sort', name: '堆排序' },
  { regex: /next\[|kmp|pattern/i, id: 'ch3-kmp', name: 'KMP算法' },
  { regex: /binary.*search|low.*high.*mid/i, id: 'ch6-binary-search', name: '折半查找' },
  { regex: /preOrder|inOrder|postOrder|visit\(T\)/i, id: 'ch4-tree-traversal', name: '二叉树遍历' },
  { regex: /DFS|visited.*DFS/i, id: 'ch5-dfs', name: '深度优先搜索' },
  { regex: /BFS|EnQueue.*BFS|Queue.*BFS/i, id: 'ch5-bfs', name: '广度优先搜索' },
  { regex: /dijkstra|dist\[|shortest/i, id: 'ch5-dijkstra', name: 'Dijkstra算法' },
  { regex: /prim|lowcost/i, id: 'ch5-prim', name: 'Prim算法' },
  { regex: /kruskal|Union.*Find/i, id: 'ch5-kruskal', name: 'Kruskal算法' },
];

function initUserCodeUpload() {
  const overlay = $('#modal-overlay');
  const closeBtn = $('#modal-close');
  const cancelBtn = $('#btn-cancel-upload');
  const analyzeBtn = $('#btn-analyze-code');
  const uploadBtn = $('#btn-upload');
  const codeInput = $('#upload-code');
  const dataInput = $('#upload-data');
  const resultDiv = $('#upload-result');

  function show() { overlay?.classList.add('open'); resultDiv.className = 'upload-result'; resultDiv.textContent = ''; }
  function hide() { overlay?.classList.remove('open'); }

  uploadBtn?.addEventListener('click', show);
  eventBus.on('show-upload-modal', show);
  closeBtn?.addEventListener('click', hide);
  cancelBtn?.addEventListener('click', hide);
  overlay?.addEventListener('click', (e) => { if (e.target === overlay) hide(); });

  analyzeBtn?.addEventListener('click', () => {
    const code = codeInput.value.trim();
    if (!code) { showToast('请粘贴代码', 'error'); return; }

    // Try pattern matching
    let matched = null;
    for (const p of PATTERNS) {
      if (p.regex.test(code)) { matched = p; break; }
    }

    if (matched) {
      const algo = registry.get(matched.id);
      resultDiv.className = 'upload-result show success';
      resultDiv.textContent = `✅ 识别为：${matched.name}(${algo?.nameEn || ''})。将使用内置可视化引擎演示。`;
      setTimeout(() => {
        hide();
        eventBus.emit('algorithm-selected', { id: matched.id });
      }, 1500);
    } else {
      resultDiv.className = 'upload-result show warning';
      resultDiv.textContent = '⚠️ 未识别算法类型。将仅显示代码（带语法高亮），暂无可视化步骤。';
      setTimeout(() => {
        hide();
        eventBus.emit('show-user-code', { code, data: dataInput.value });
      }, 1500);
    }
  });
}

  rendererMap[RENDERER_TYPES.ARRAY] = new ArrayRenderer(canvasManager);

function getRenderer(type) {
  return rendererMap[type] || rendererMap[RENDERER_TYPES.ARRAY];
}

// Search algorithms that support custom search key
const SEARCH_ALGO_IDS = new Set(['ch6-binary-search', 'ch6-bst-search', 'ch6-hash-search']);

// Update info panel directly (no event emission)
function showAlgoInfoForPanel(id) {
  const algo = registry.get(id);
  const content = $('#info-content');
  const panel = $('#info-panel');
  if (!algo || !content || !panel) return;
  const timeEntries = Object.entries(algo.complexity.time).map(([k, v]) => {
    const label = k === 'best' ? '最好' : k === 'average' ? '平均' : '最坏';
    return `<span class="complexity-item"><span class="complexity-label">${label}:</span><span class="complexity-value">${v}</span></span>`;
  }).join('');
  content.innerHTML = `
    <h3>${algo.name} <span style="color:var(--text-muted);font-weight:400;font-size:0.85rem">${algo.nameEn}</span></h3>
    <div class="complexity">${timeEntries}<span class="complexity-item"><span class="complexity-label">空间:</span><span class="complexity-value">${algo.complexity.space}</span></span>${algo.complexity.stable ? `<span class="complexity-item"><span class="complexity-label">稳定性:</span><span class="complexity-value">${algo.complexity.stable}</span></span>` : ''}</div>
    <p class="description">${algo.description}</p>
    ${algo.keyPoints?.length ? `<div class="key-points"><h4>考研要点</h4><ul>${algo.keyPoints.map(p => `<li>${p}</li>`).join('')}</ul></div>` : ''}
  `;
  panel.classList.add('open');
  panel.style.maxHeight = '160px';

// Load algorithm — fast: steps + render sync, code highlight deferred
function loadAlgorithm(id, customSearchKey) {
  const algo = registry.get(id);
  if (!algo) return;

  stepEngine.pause();
  state.setAlgorithm(algo, algo.defaultData);
  currentRenderer = getRenderer(algo.rendererType);

  // Update title (instant)
  const titleEl = $('#viz-title');
  const badgeEl = $('#viz-badge');
  if (titleEl) titleEl.textContent = `${algo.name} — ${algo.nameEn}`;
  if (badgeEl) badgeEl.textContent = algo.chapterName;
  const placeholder = $('#viz-placeholder');
  if (placeholder) placeholder.classList.add('hidden');

  // Show/hide search key input
  const searchSection = $('#search-key-section');
  if (searchSection) {
    if (SEARCH_ALGO_IDS.has(id)) {
      searchSection.style.display = 'flex';
      const searchInput = $('#search-key-input');
      if (searchInput && customSearchKey === undefined) {
        // Set default search key
        const defaults = { 'ch6-binary-search': 64, 'ch6-bst-search': 60, 'ch6-hash-search': 27 };
        searchInput.value = defaults[id] || '';
      }
    } else {
      searchSection.style.display = 'none';
    }
  }

  // Generate steps + render (sync, fast ~0ms)
  const data = algo.defaultData || getDefaultDataForAlgo(algo);
  stepEngine.load(algo, data, customSearchKey);
  const step = stepEngine.getCurrentStep();
  if (step && currentRenderer) currentRenderer.render(step);
  if (step) updateStepDescription(step);

  // Notify info panel directly (no event to avoid recursion)
  showAlgoInfoForPanel(id);

  // Defer ONLY code highlighting (the slow part ~3ms)
  requestAnimationFrame(() => {
    updateCodeDisplay(algo.sourceCode, step ? step.line : -1);
  });
}

function getDefaultDataForAlgo(algo) {
  // Some algorithms don't use array data
  return null;
}

// Update step description
function updateStepDescription(step) {
  const descEl = $('#step-desc-text');
  const container = $('#step-description');
  if (!descEl || !container) return;

  if (step?.description) {
    descEl.textContent = step.description;
    container.classList.remove('hidden');
  } else {
    container.classList.add('hidden');
  }
}

// Data edit modal
function initDataModal() {
  const overlay = $('#data-modal-overlay');
  const closeBtn = $('#data-modal-close');
  const cancelBtn = $('#btn-cancel-data');
  const applyBtn = $('#btn-apply-data');
  const randomBtn = $('#btn-random-data');
  const input = $('#data-edit-input');
  const label = $('#data-edit-label');

  function show() {
    if (!state.currentAlgorithm) { showToast('请先选择一个算法', 'error'); return; }
    const algo = state.currentAlgorithm;
    if (algo.defaultData && Array.isArray(algo.defaultData)) {
      input.value = algo.defaultData.join(', ');
      label.textContent = '输入数据（逗号分隔的数字）';
    } else {
      input.value = '';
      label.textContent = '此算法不支持自定义数据';
    }
    overlay?.classList.add('open');
  }

  function hide() { overlay?.classList.remove('open'); }

  eventBus.on('show-data-modal', show);
  closeBtn?.addEventListener('click', hide);
  cancelBtn?.addEventListener('click', hide);
  overlay?.addEventListener('click', (e) => { if (e.target === overlay) hide(); });

  applyBtn?.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;
    const data = text.split(/[,\s]+/).map(Number).filter(n => !isNaN(n));
    if (data.length === 0) { showToast('请输入有效的数字', 'error'); return; }
    state.setData(data);
    stepEngine.load(state.currentAlgorithm, data);
    hide();
    showToast('数据已更新', 'success');
  });

  randomBtn?.addEventListener('click', () => {
    const size = 8 + Math.floor(Math.random() * 5);
    const data = Array.from({ length: size }, () => Math.floor(Math.random() * 90) + 10);
    input.value = data.join(', ');
  });
}

// User code display
function initUserCodeHandler() {
  eventBus.on('show-user-code', ({ code, data }) => {
    const titleEl = $('#viz-title');
    const badgeEl = $('#viz-badge');
    if (titleEl) titleEl.textContent = '用户自定义代码';
    if (badgeEl) badgeEl.textContent = '自定义';

    updateCodeDisplay(code, -1);
    showToast('代码已加载（仅显示模式）', 'info');
  });
}

// Canvas resize handler
function handleResize() {
  const step = stepEngine.getCurrentStep();
  if (step && currentRenderer) {
    currentRenderer.render(step);
  }
}

// Initialize
function init() {
  // Init canvas
  const canvas = $('#viz-canvas');
  if (canvas) {
    canvasManager.init(canvas, handleResize);
  }

  createRenderers();

  // Init UI components
  initSidebar();
  initCodePanel();
  initControlBar();
  initInfoPanel();
  initUserCodeUpload();
  initDataModal();
  initUserCodeHandler();

  // Search key input handler
  const searchBtn = $('#btn-search-go');
  const searchInput = $('#search-key-input');
  function doSearch() {
    if (!state.currentAlgorithm || !SEARCH_ALGO_IDS.has(state.currentAlgorithm.id)) return;
    const val = searchInput ? parseInt(searchInput.value, 10) : NaN;
    if (isNaN(val)) return;
    loadAlgorithm(state.currentAlgorithm.id, val);
  }
  searchBtn?.addEventListener('click', doSearch);
  searchInput?.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });

  // Wire step engine events to renderer
  eventBus.on('step-changed', ({ step, index }) => {
    if (!step) return;
    if (currentRenderer) currentRenderer.render(step);
    updateStepDescription(step);
    // Defer code line highlight (Prism DOM lookup)
    requestAnimationFrame(() => highlightLine(step.line));
  });

  eventBus.on('steps-loaded', ({ steps, algorithm, currentIndex }) => {
    if (steps.length > 0 && currentRenderer) {
      currentRenderer.render(steps[0]);
    }
  });

  // Algorithm selection from sidebar (only, not from loadAlgorithm)
  eventBus.on('algorithm-selected', ({ id }) => {
    if (state.currentAlgorithmId !== id) loadAlgorithm(id);
  });

  // Auto-select first algorithm for demo
  const all = registry.getAll();
  if (all.length > 0) {
    // Select first sorting algorithm as default
    const first = registry.get('ch7-bubble-sort') || all[0];
    setTimeout(() => {
      loadAlgorithm(first.id);
      // Mark sidebar item as active
      const item = document.querySelector(`.algo-item[data-id="${first.id}"]`);
      if (item) item.classList.add('active');
    }, 100);
  }
}

// Start when DOM is ready — guard against multiple init calls
let _initialized = false;
function safeInit() {
  if (_initialized) return;
  _initialized = true;
  try {
    init();
  } catch (e) {
    console.error('[App] Init error:', e);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', safeInit, { once: true });
} else {
  safeInit();
}
